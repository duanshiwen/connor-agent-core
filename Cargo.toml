[workspace]
members = [
    "crates/conversation-core",
    "crates/conversation-journal",
    "crates/conversation-kernel",
    "crates/conversation-runtime",
    "crates/entity-core",
    "crates/assistant-core",
    "crates/model-adapter",
    "crates/agent-runtime",
    "crates/action-core",
    "crates/action-runtime",
    "crates/capability-policy",
    "crates/audit-log",
    "crates/artifact-core",
    "crates/surface-core",
    "crates/asset-core",
    "crates/asset-index",
    "crates/knowledge-entity",
    "crates/browser-entity",
    "crates/browser-kernel-core",
    "crates/reminder-core",
    "crates/notification-core",
    "crates/scheduler",
    "crates/identity-core",
    "crates/server-account-core",
    "crates/connector-runtime",
    "crates/mail-entity",
    "crates/device-pairing-core",
    "crates/sync-runtime",
    "crates/p2p-sync-runtime",
    "crates/person-entity",
    "crates/relationship-core",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["shiwen"]

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# IDs
uuid = { version = "1", features = ["v4"] }

# Error handling
anyhow = "1"
thiserror = "2"

# YAML
serde_yml = "0.0.12"

# Async
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Browser automation
chromiumoxide = "0.9"
futures-util = "0.3"

# Testing
tempfile = "3"
